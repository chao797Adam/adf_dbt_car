version: 2

models:
  - name: dim_dealer
    columns:
      - name: dim_dealer_key
        tests:
          - unique
          - not_null
      - name: dealer_id
        tests:
          - unique
          - not_null
      - name: dealername
        tests:
          - not_null

  - name: dim_model
    columns:
      - name: dim_model_key
        tests:
          - unique
          - not_null
      - name: model_id
        tests:
          - unique
          - not_null
      - name: model_category
        tests:
          - not_null

  - name: dim_branch
    columns:
      - name: dim_branch_key
        tests:
          - unique
          - not_null
      - name: branch_id
        tests:
          - unique
          - not_null
      - name: branchname
        tests:
          - not_null

  - name: dim_date
    columns:
      - name: dim_date_key
        tests:
          - unique
          - not_null
      - name: date_id
        tests:
          - unique
          - not_null

  - name: fact_sales
    columns:
      - name: dim_dealer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dealer')
                field: dim_dealer_key

      - name: dim_branch_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_branch')
                field: dim_branch_key

      - name: dim_model_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_model')
                field: dim_model_key

      - name: dim_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: dim_date_key

      - name: revenue
        tests:
          - not_null

      - name: units_sold
        tests:
          - not_null